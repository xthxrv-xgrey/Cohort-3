<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexFit</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <section id="page1">
        <div class="top-left">
            <img id="bg" src="./assets/man-red-jacket.png" alt="man in red jacket">
            <img id="round-top" src="./assets/round.png" alt="round shape">
            <div class="tags-container">
                <div class="tags">
                    <div class="icon">
                        <i class="ri-fire-line"></i>
                    </div>
                    <div class="text">
                        <h2>35</h2>
                        <p>MIN</p>
                    </div>
                </div>
                <div class="tags">
                    <div class="icon">
                        <i class="ri-pulse-line"></i>
                    </div>
                    <div class="text">
                        <h2>NO</h2>
                        <p>EXCUSES</p>
                    </div>
                </div>
                <div class="tags">
                    <div class="icon">
                        <i class="ri-run-line"></i>
                    </div>
                    <div class="text">
                        <h2>7</h2>
                        <p>DAYS</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="top-left-2">
            <div id="art">
                <img src="./assets/lines.png" alt="lines">
            </div>
            <div id="text-top-left-2">
                <p>USE OUR APP FOR COMPILING A QUALITY WORKOUT!</p>
            </div>
            <div id="playstore">
                <img src="./assets/playstore.jpg" alt="playstore">
            </div>
            <div id="appstore">
                <img src="./assets/appstore.jpg" alt="appstore">
            </div>
        </div>
        <div class="top-right-2"></div>
        <div class="top-right"></div>
        <div class="center-left"></div>
        <div class="center">
            <img src="./assets/logo.png" alt="logo">
            <h1>FlexFit</h1>
        </div>
        <div class="bottom-left"></div>
        <div class="bottom-center"></div>
        <div class="bottom-right"></div>
    </section>
</body>

</html>

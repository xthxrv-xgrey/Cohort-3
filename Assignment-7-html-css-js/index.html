<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <title>Task Manager</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="./assets/images/logo.png" alt="logo">
            <h1>TaskFlow</h1>
        </div>
        <div class="search">
            <input id="searchBar" type="search" placeholder="🔍 Search Tasks, Projects">
        </div>
        <div class="menu">
            <i class="ri-sun-line"></i>
            <button>Upcoming</button>
            <button>Hello</button>
        </div>
    </header>

    <section>
        <nav>
            <div class="categories">
                <div class="category" id="inbox">
                    <div class="type">
                        <i class="ri-inbox-2-line"></i>
                        <h3>Inbox</h3>
                    </div>
                </div>
                <div class="category" id="today">
                    <div class="type">
                        <i class="ri-calendar-line"></i>
                        <h3>Today</h3>
                    </div>
                    <span id="todaysTaskCount">0</span>
                </div>
                <div class="category" id="upcoming">
                    <div class="type">
                        <i class="ri-calendar-2-line"></i>
                        <h3>Upcoming</h3>
                    </div>
                    <span id="tomorowsTaskCount">0</span>
                </div>
                <div class="category" id="settings">
                    <div class="type">
                        <i class="ri-settings-5-line"></i>
                        <h3>Setttings</h3>
                    </div>
                </div>
            </div>
            <div id="projects">
                <div class="project-title">
                    <h3>Projects</h3>
                    <i class="ri-add-large-line" id="addProjectBtn"></i>
                </div>
                <div class="project">
                    <h3>Coding</h3>
                    <i class="ri-delete-bin-2-line"></i>
                </div>
            </div>
        </nav>
        <main>
            <nav>
                <div class="task-types">
                    <button id="active">Active <span id="activeTaskCount">0</span></button>
                    <button id="completed">Completed <span id="completedTaskCount">0</span></button>
                    <button id="bin">Bin <span id="binTaskCount">0</span></button>
                </div>
                <button id="addTask"><i class="ri-add-line"></i> Add Task</button>
            </nav>
            <div id="tasks">
            </div>
        </main>
    </section>

    <div id="taskModal">
        <i class="ri-close-large-line" id="closeTaskModal"></i>
        <form class="task-form" id="taskForm">
            <h1 id="taskModalHeading">Add Task</h1>

            <input type="text" required placeholder="Title">

            <input type="text" required placeholder="Description...">

            <select id="project" name="project" required>
                <option value="" disabled selected style="color: grey;">--Select a Project--</option>
                <option value="default">Default</option>
            </select>
            <input id="tag" type="text" placeholder="Tag..." required>

            <div>
                <label for="deadline">Deadline:</label>
                <input id="deadline" type="date" required>
            </div>

            <select id="priority" name="priority" required>
                <option value="" disabled selected style="color: grey;">--Select Priority--</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <button type="submit" id="addBtn">Add Task</button>
        </form>
    </div>

    <div id="projectModal">
        <i class="ri-close-large-line" id="closeProjectModal"></i>
        <form class="project-form" id="projectForm">
            <h1 id="projectModalHeading">Add Project</h1>

            <div><input type="text" required placeholder="Project Name">

                <button type="submit" id="addProjectSubmitBtn">Add Project</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>

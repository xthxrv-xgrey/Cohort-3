<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <title>Credo</title>
</head>

<body>
    <main>
        <header>
            <div class="logoSection">
                <h1>CREDO</h1>
            </div>
            <div>
                <span id="display-name">Name</span>
                <button class="header-btn" id="menu-btn">
                    <i class="ri-menu-line"></i>
                    <span>Menu</span>
                </button>
            </div>
        </header>
        <section>
            <div class="overview">
                <div class="title">
                    <h2>Financial Overview</h2>
                    <p>Real-time tracking application</p>
                </div>
                <div class="pnl-section">
                    <div class="pnl-card">
                        <i class="fa-solid fa-building-columns" style="color: #1e40af; background-color: #dbeafe;"></i>
                        <p>Current Balance</p>
                        <h3 id="current-balance">$ 0</h3>
                    </div>
                    <div class=" pnl-card">
                        <i class="fa-solid fa-arrow-trend-up" style="color: green; background-color: #dcfce7;"></i>
                        <p>Total Income</p>
                        <h3 id="income">$ 0</h3>
                    </div>
                    <div class="pnl-card">
                        <i class="fa-solid fa-arrow-trend-down" style="color: red; background-color: #fee2e2;"></i>
                        <p>Total Expenses</p>
                        <h3 id="expenses">$ 0</h3>
                    </div>
                    <div class="pnl-card">
                        <i class="fa-solid fa-piggy-bank" style="color: #1e40af; background-color: #dbeafe;"></i>
                        <p>Transactions</p>
                        <h3 id="transactions">$ 0</h3>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="loginModal">
    </div>
    <div id="registerModal">
    </div>
    <div id="addTransactionModal">
    </div>
    <div id="editTransactionModal">
    </div>

    <script src="script.js"></script>
</body>

</html>
